name: Sync YouTube Latest Episodes

on:
  schedule:
    # Every hour — YouTube RSS is free and does not require an API key
    - cron: '0 * * * *'
  workflow_dispatch: # manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/sync-youtube-episodes.mjs'
      - '.github/workflows/sync-youtube.yml'

permissions:
  contents: write

concurrency:
  group: sync-youtube-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history only if rebasing; token can push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync episodes from YouTube RSS
        id: sync
        run: node scripts/sync-youtube-episodes.mjs

      - name: Commit if episodes changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          # Bail cleanly if nothing staged (race / no-op signature edge case)
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync latest YouTube episodes"
          # Rebase on latest main in case another push landed during the run
          git pull --rebase origin main
          git push
